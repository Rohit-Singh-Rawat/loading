name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Lint scans the whole repository, but tests need only the library at
      # the root. Excluding web also avoids its licensed icon installation scripts.
      - run: pnpm install --frozen-lockfile --filter loading-dev
      - run: pnpm lint
      - run: pnpm test
